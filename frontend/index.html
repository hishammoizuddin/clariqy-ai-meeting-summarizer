<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Primary ──────────────────────────────────────────────────────────── -->
  <title>ClarIQy — AI Meeting Summarizer</title>
  <meta name="description" content="ClarIQy transcribes, summarizes, and organizes your meetings into a searchable knowledge base. Record live or upload any file — get instant AI summaries, speaker identification, and ask your meetings anything." />

  <!-- ── Favicon ───────────────────────────────────────────────────────────── -->
  <link rel="icon" type="image/png" sizes="1024x1024" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- ── Open Graph (LinkedIn, Facebook, Slack, iMessage, etc.) ────────────── -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://clariqy.aisynchlabs.com" />
  <meta property="og:title" content="ClarIQy — AI Meeting Summarizer" />
  <meta property="og:description" content="Transcribe, summarize, and ask your meetings anything. Organize sessions into collections and search across your entire meeting history instantly." />
  <meta property="og:image" content="https://clariqy.aisynchlabs.com/og-image.png" />
  <meta property="og:image:width" content="3840" />
  <meta property="og:image:height" content="2160" />
  <meta property="og:site_name" content="ClarIQy" />

  <!-- ── Twitter / X Card ─────────────────────────────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://clariqy.aisynchlabs.com" />
  <meta name="twitter:title" content="ClarIQy — AI Meeting Summarizer" />
  <meta name="twitter:description" content="Transcribe, summarize, and ask your meetings anything. Organize sessions into collections and search across your entire meeting history instantly." />
  <meta name="twitter:image" content="https://clariqy.aisynchlabs.com/og-image.png" />

  <!-- ── Fonts ─────────────────────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-50 relative overflow-x-hidden text-black antialiased selection:bg-gray-200 selection:text-black">
  <!-- Subtle ambient background for monochrome -->
  <div class="fixed inset-0 -z-10 bg-white">
    <div
      class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-gray-100/50 via-white to-gray-50/50">
    </div>
  </div>

  <div id="root" class="relative z-0 h-full"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
